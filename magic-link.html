<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HoodVibe — כניסה</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#1D3F5E;--navy-dark:#152E45;--orange:#E8673A;--bg:#f5f5f5;--surface:#fff;--surface2:#f8f8f8;--border:#e5e5e5;--text:#1a1a1a;--text2:#666;--text3:#999}
body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:flex;justify-content:center;padding:40px 20px}
.phone{width:375px;min-height:780px;background:var(--surface);border-radius:32px;border:1px solid #ddd;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,0.12)}
.status-bar{height:44px;background:var(--navy-dark);display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex-shrink:0}
.status-bar span{color:#fff;font-size:12px;font-weight:500}
.hero{background:var(--navy);padding:44px 32px 40px;display:flex;flex-direction:column;align-items:center;gap:0;flex-shrink:0}
.logo-hero{direction:ltr;display:flex;align-items:baseline;margin-bottom:8px}
.logo-main{color:#fff;font-size:28px;font-weight:700;letter-spacing:-0.5px}
.logo-dot{color:var(--orange);font-size:28px;font-weight:700;margin:0 2px}
.logo-social{color:rgba(255,255,255,0.75);font-size:18px}
.tagline{color:rgba(255,255,255,0.6);font-size:14px;text-align:center;line-height:1.5;margin-top:4px}
.body{flex:1;padding:32px 24px;display:flex;flex-direction:column;gap:0}
.step-title{font-size:22px;font-weight:700;color:var(--text);margin-bottom:6px}
.step-sub{font-size:14px;color:var(--text2);line-height:1.5;margin-bottom:28px}
.input-group{margin-bottom:16px}
.input-label{font-size:13px;font-weight:500;color:var(--text2);margin-bottom:6px;display:block}
.input-field{width:100%;padding:14px 16px;border:1.5px solid var(--border);border-radius:12px;font-size:16px;color:var(--text);outline:none;background:var(--surface2);transition:border-color 0.15s}
.input-field:focus{border-color:var(--navy);background:#fff}
.input-field::placeholder{color:var(--text3)}
.cta-btn{width:100%;padding:15px;background:var(--navy);border:none;border-radius:14px;color:#fff;font-size:16px;font-weight:600;cursor:pointer;margin-top:8px}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0}
.divider-line{flex:1;height:1px;background:var(--border)}
.divider-text{font-size:13px;color:var(--text3)}
.whatsapp-btn{width:100%;padding:14px;background:#E8F5E9;border:1.5px solid #A5D6A7;border-radius:14px;color:#2E7D32;font-size:15px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.wa-icon{font-size:18px}
.legal{font-size:11px;color:var(--text3);text-align:center;line-height:1.5;margin-top:auto;padding-top:24px}
.legal a{color:var(--navy);text-decoration:none}
</style>
</head>
<body>
<div class="phone">
  <div class="status-bar"><span>9:41</span><span></span><span>●●●</span></div>
  <div class="hero">
    <div class="logo-hero"><span class="logo-main">HoodVibe</span><span class="logo-dot">●</span><span class="logo-social">Social</span></div>
    <div class="tagline">הרשת החברתית של השכונה שלך</div>
  </div>
  <div class="body">
    <div class="step-title">כניסה / הרשמה</div>
    <div class="step-sub">הכנס את האימייל שלך — נשלח לך קישור כניסה ישיר. ללא סיסמה.</div>
    <div class="input-group">
      <label class="input-label">אימייל</label>
      <input class="input-field" type="email" placeholder="dana@example.com" value="">
    </div>
    <button class="cta-btn">שלח קישור כניסה ✉️</button>
    <div class="divider">
      <div class="divider-line"></div>
      <span class="divider-text">או</span>
      <div class="divider-line"></div>
    </div>
    <button class="whatsapp-btn"><span class="wa-icon">💬</span> כניסה דרך WhatsApp</button>
    <div class="legal">
      בכניסה אתה מסכים ל<a href="#">תנאי השימוש</a> ו<a href="#">מדיניות הפרטיות</a> שלנו.
      לא שומרים סיסמאות. לא מוכרים מידע.
    </div>
  </div>
</div>
</body>
</html>
