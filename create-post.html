<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HoodVibe — יצירת פוסט</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#1D3F5E;--navy-dark:#152E45;--orange:#E8673A;--bg:#f5f5f5;--surface:#fff;--surface2:#f8f8f8;--border:#e5e5e5;--text:#1a1a1a;--text2:#666;--text3:#999}
body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:flex;justify-content:center;padding:40px 20px}
.phone{width:375px;min-height:820px;background:var(--bg);border-radius:32px;border:1px solid #ddd;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,0.12)}
.status-bar{height:44px;background:var(--navy-dark);display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.status-bar span{color:#fff;font-size:12px;font-weight:500}
.topbar{height:52px;background:var(--navy);display:flex;align-items:center;padding:0 16px;gap:12px;justify-content:space-between}
.close-btn-top{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.12);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.topbar h2{color:#fff;font-size:16px;font-weight:500}
.pub-btn{padding:7px 16px;background:#fff;border-radius:18px;border:none;color:var(--navy);font-size:13px;font-weight:500;cursor:pointer}
.content{flex:1;overflow-y:auto;scrollbar-width:none;background:var(--surface2);padding:12px;display:flex;flex-direction:column;gap:12px}
.content::-webkit-scrollbar{display:none}
.section{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px}
.section-label{font-size:12px;color:var(--text3);margin-bottom:8px;font-weight:500}
.cats-grid{display:flex;flex-wrap:wrap;gap:7px}
.cat-chip{padding:7px 14px;border-radius:18px;border:1px solid var(--border);background:var(--surface2);font-size:13px;color:var(--text2);cursor:pointer}
.cat-chip.sel{background:var(--navy);color:#fff;border-color:var(--navy)}
.field-label{font-size:12px;color:var(--text3);font-weight:500;margin-bottom:6px}
.text-input{width:100%;border:none;border-bottom:1px solid var(--border);background:transparent;font-size:15px;color:var(--text);padding:6px 0;direction:rtl;outline:none;font-family:inherit}
.char-count{font-size:11px;color:var(--text3);text-align:left;margin-top:4px}
.textarea{width:100%;border:none;background:transparent;font-size:14px;color:var(--text);padding:6px 0;direction:rtl;outline:none;resize:none;font-family:inherit;line-height:1.6;min-height:90px}
.img-add{border:1px dashed var(--border);border-radius:10px;height:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;background:var(--surface2)}
.img-add span{font-size:12px;color:var(--text3)}
.link-field{width:100%;border:1px solid var(--border);border-radius:8px;background:var(--surface2);font-size:13px;color:var(--text2);padding:9px 12px;direction:ltr;outline:none;font-family:inherit}
.preview-card{border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-top:10px;display:flex}
.preview-img{width:64px;background:var(--surface2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.preview-text{padding:10px;flex:1}
.preview-url{font-size:11px;color:var(--text3)}
.preview-title{font-size:13px;font-weight:500;color:var(--text);margin-top:2px;line-height:1.3}
.submit-btn{width:100%;padding:14px;background:var(--navy);border:none;border-radius:10px;color:#fff;font-size:15px;font-weight:500;cursor:pointer}
</style>
</head>
<body>
<div class="phone">
  <div class="status-bar"><span>9:41</span><span></span><span>●●●</span></div>
  <div class="topbar">
    <div class="close-btn-top">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </div>
    <h2>פרסם פוסט</h2>
    <button class="pub-btn">פרסם</button>
  </div>
  <div class="content">
    <div class="section">
      <div class="section-label">קטגוריה (חובה)</div>
      <div class="cats-grid">
        <div class="cat-chip sel">בייביסיטר</div>
        <div class="cat-chip">הליכת כלבים</div>
        <div class="cat-chip">מכירה / חינם</div>
        <div class="cat-chip">קרפול</div>
        <div class="cat-chip">שאלה לשכנים</div>
        <div class="cat-chip">עסקים</div>
        <div class="cat-chip">כללי</div>
      </div>
    </div>
    <div class="section">
      <div class="field-label">כותרת</div>
      <input class="text-input" value="מחפשת בייביסיטרית לסופי שבוע" />
      <div class="char-count">37/80</div>
      <div style="margin-top:14px">
        <div class="field-label">תוכן הפוסט</div>
        <textarea class="textarea">שני ילדים 4 ו-7, שישי-שבת בערב. מועדפת מניסיון עם ילדים בגיל זה.</textarea>
        <div class="char-count">72/1000</div>
      </div>
    </div>
    <div class="section">
      <div class="field-label">תמונות (אופציונלי, עד 3)</div>
      <div class="img-add">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        <span>הוסף תמונה</span>
      </div>
    </div>
    <div class="section">
      <div class="field-label">לינק (אופציונלי)</div>
      <input class="link-field" placeholder="https://..." />
      <div class="preview-card">
        <div class="preview-img">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="1.5"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        </div>
        <div class="preview-text">
          <div class="preview-url">yad2.co.il</div>
          <div class="preview-title">בייביסיטר — מדריך להורים</div>
        </div>
      </div>
    </div>
    <button class="submit-btn">פרסם בשכונה</button>
  </div>
</div>
</body>
</html>
