<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HoodVibe — בדוק את האימייל שלך</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#1D3F5E;--navy-dark:#152E45;--orange:#E8673A;--bg:#f5f5f5;--surface:#fff;--surface2:#f8f8f8;--border:#e5e5e5;--text:#1a1a1a;--text2:#666;--text3:#999}
body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:flex;justify-content:center;padding:40px 20px}
.phone{width:375px;min-height:780px;background:var(--surface);border-radius:32px;border:1px solid #ddd;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,0.12)}
.status-bar{height:44px;background:var(--navy-dark);display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex-shrink:0}
.status-bar span{color:#fff;font-size:12px;font-weight:500}
.hero{background:var(--navy);padding:32px 24px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.logo-hero{direction:ltr;display:flex;align-items:baseline}
.logo-main{color:#fff;font-size:22px;font-weight:700;letter-spacing:-0.3px}
.logo-dot{color:var(--orange);font-size:22px;font-weight:700;margin:0 1px}
.logo-social{color:rgba(255,255,255,0.75);font-size:15px}
.body{flex:1;padding:0 24px 32px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:0}
.envelope-icon{font-size:72px;margin-bottom:24px;filter:drop-shadow(0 4px 12px rgba(0,0,0,0.1))}
.sent-title{font-size:22px;font-weight:700;color:var(--text);margin-bottom:10px}
.sent-email{font-size:15px;color:var(--navy);font-weight:500;margin-bottom:10px}
.sent-sub{font-size:14px;color:var(--text2);line-height:1.6;margin-bottom:32px}
.open-btn{width:100%;padding:14px;background:var(--navy);border:none;border-radius:14px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-bottom:12px}
.resend-btn{background:none;border:none;color:var(--text3);font-size:14px;cursor:pointer;padding:8px}
.tip-box{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-top:24px;text-align:right}
.tip-title{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:4px}
.tip-text{font-size:12px;color:var(--text3);line-height:1.5}
</style>
</head>
<body>
<div class="phone">
  <div class="status-bar"><span>9:41</span><span></span><span>●●●</span></div>
  <div class="hero">
    <div class="logo-hero"><span class="logo-main">HoodVibe</span><span class="logo-dot">●</span><span class="logo-social">Social</span></div>
  </div>
  <div class="body">
    <div class="envelope-icon">✉️</div>
    <div class="sent-title">בדוק את האימייל שלך</div>
    <div class="sent-email">dana@example.com</div>
    <div class="sent-sub">שלחנו לך קישור כניסה. לחץ עליו כדי להיכנס — הוא תקף ל-15 דקות.</div>
    <button class="open-btn">פתח אפליקציית אימייל</button>
    <button class="resend-btn">לא קיבלתי — שלח שוב</button>
    <div class="tip-box">
      <div class="tip-title">💡 לא מוצא?</div>
      <div class="tip-text">בדוק בתיקיית הספאם. השולח הוא noreply@hoodvibe.social</div>
    </div>
  </div>
</div>
</body>
</html>
